<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="A confirmation page of a product review form">
    <meta name="author" content="Emily Larson">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Review Submitted</h1>
    </header>
    <main>
        <div id="thanks">
            <p>Thank you! Your review has been submitted. We appreciate your time.</p>
            <p>You have submitted <span class="visits"></span>!</p>
        </div>
    </main>
    <footer>
        <p ID="copyright"></p>
        <p ID="modified"></p>
    </footer>
</body>

</html>
